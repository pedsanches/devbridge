# Promtail Configuration for DevBridge
# Collects Docker container logs and sends to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collect Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only collect logs from devbridge containers
      - source_labels: ['__meta_docker_container_name']
        regex: '/devbridge-.*'
        action: keep
      # Use container name as label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Add service label based on container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/devbridge-(.*)'
        target_label: service
      # Add compose project label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: project
      # Add compose service label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
    pipeline_stages:
      # Parse JSON logs if available
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
          source: message
      # Extract log level for filtering
      - labels:
          level:
