# Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: 'DevBridge Dashboards'
    orgId: 1
    folder: 'DevBridge'
    folderUid: 'devbridge'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
