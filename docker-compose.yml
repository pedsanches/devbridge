# ============================================================
# DevBridge - Docker Compose (Development)
# ============================================================
# Usage: docker-compose up -d
# ============================================================

services:
  # ============================================================
  # PostgreSQL - Primary Database
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: devbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devbridge
      POSTGRES_PASSWORD: devbridge
      POSTGRES_DB: devbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U devbridge -d devbridge" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis - Cache & Celery Broker
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: devbridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Qdrant - Vector Database
  # ============================================================
  qdrant:
    image: qdrant/qdrant:latest
    profiles: [ "ai" ]
    container_name: devbridge-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Microsoft Presidio - PII Detection & Anonymization
  # ============================================================
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    profiles: [ "ai" ]
    container_name: devbridge-presidio-analyzer
    restart: unless-stopped
    ports:
      - "5001:3000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    profiles: [ "ai" ]
    container_name: devbridge-presidio-anonymizer
    restart: unless-stopped
    ports:
      - "5002:3000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # Observability Stack (Grafana + Loki + Jaeger)
  # Start with: docker-compose --profile observability up -d
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    profiles: [ "observability" ]
    container_name: devbridge-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=devbridge
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:latest
    profiles: [ "observability" ]
    container_name: devbridge-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:latest
    profiles: [ "observability" ]
    container_name: devbridge-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: [ "observability" ]
    container_name: devbridge-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:16686/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  promtail_data:
    driver: local

# ============================================================
# Networks (optional, for service isolation)
# ============================================================
networks:
  default:
    name: devbridge-network
