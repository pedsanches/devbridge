openapi: 3.1.0
info:
  title: DevBridge
  description: Making Technical Work Visible to Non-Technical Stakeholders via AI
    Translation
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - Health
      summary: Health Check
      description: "Health check endpoint.\n\nReturns:\n    HealthResponse: Current\
        \ health status of the application."
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/health/ready:
    get:
      tags:
      - Health
      summary: Readiness Check
      description: "Kubernetes readiness probe.\n\nReturns:\n    dict: Ready status\
        \ for k8s."
      operationId: readiness_check_api_v1_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Readiness Check Api V1 Health Ready Get
  /api/v1/health/live:
    get:
      tags:
      - Health
      summary: Liveness Check
      description: "Kubernetes liveness probe.\n\nReturns:\n    dict: Alive status\
        \ for k8s."
      operationId: liveness_check_api_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Liveness Check Api V1 Health Live Get
  /api/v1/auth/magic:
    post:
      tags:
      - Auth
      summary: Request Magic Link
      description: 'Request a magic link for passwordless authentication.


        A magic link will be sent to the provided email address.

        The link expires in 15 minutes.'
      operationId: request_magic_link_api_v1_auth_magic_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicLinkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/verify:
    post:
      tags:
      - Auth
      summary: Verify Magic Link
      description: 'Verify a magic link token and set httpOnly cookie.


        If the user doesn''t exist, a new account and personal organization

        will be created automatically.'
      operationId: verify_magic_link_api_v1_auth_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Get Current User
      description: Get the current authenticated user.
      operationId: get_current_user_api_v1_auth_me_get
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      description: Logout by clearing the session cookie.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Logout Api V1 Auth Logout Post
  /api/v1/auth/dev-login:
    post:
      tags:
      - Auth
      summary: Dev Login
      description: 'Development-only login endpoint.


        Bypasses magic link email for faster testing.

        Only works when ENVIRONMENT=development.


        Default test email: test@devbridge.local'
      operationId: dev_login_api_v1_auth_dev_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
              default:
                email: test@example.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/integrations:
    get:
      tags:
      - Settings
      summary: Get Integrations
      description: "Get status of all integrations for the current organization.\n\
        \nShows connection status for GitHub, Slack, and other data sources.\n\nArgs:\n\
        \    db: Database session.\n    org_id: Current organization context.\n  \
        \  _current_user: Authenticated user.\n\nReturns:\n    Integration statuses."
      operationId: get_integrations_api_v1_settings_integrations_get
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/github/connect:
    post:
      tags:
      - Settings
      summary: Connect Github
      description: "Connect GitHub integration using a Personal Access Token.\n\n\
        The token is encrypted before storage. After connecting,\nrepositories can\
        \ be synced to populate data sources.\n\nArgs:\n    db: Database session.\n\
        \    request: GitHub PAT.\n    org_id: Current organization context.\n   \
        \ _current_user: Authenticated user.\n\nReturns:\n    Connection result with\
        \ status."
      operationId: connect_github_api_v1_settings_github_connect_post
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectGitHubRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectGitHubResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/github/disconnect:
    post:
      tags:
      - Settings
      summary: Disconnect Github
      description: "Disconnect GitHub integration.\n\nRemoves the stored token but\
        \ keeps existing repositories and activities.\n\nArgs:\n    db: Database session.\n\
        \    org_id: Current organization context.\n    _current_user: Authenticated\
        \ user."
      operationId: disconnect_github_api_v1_settings_github_disconnect_post
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/github/refresh:
    post:
      tags:
      - Settings
      summary: Refresh Repositories
      description: "Refresh/rediscover GitHub repositories.\n\nUses the existing stored\
        \ token to fetch all accessible repositories\nand adds any new ones that weren't\
        \ previously discovered.\nExisting repositories and their activities are not\
        \ affected.\n\nArgs:\n    db: Database session.\n    org_id: Current organization\
        \ context.\n    _current_user: Authenticated user.\n\nReturns:\n    Number\
        \ of new repositories discovered."
      operationId: refresh_repositories_api_v1_settings_github_refresh_post
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshRepositoriesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/data-sources:
    get:
      tags:
      - Settings
      summary: Get Data Sources
      description: "Get all data sources (repositories) for the organization.\n\n\
        Returns a list of connected repositories with their indexing status,\nactivity\
        \ counts, and sync information.\n\nArgs:\n    db: Database session.\n    org_id:\
        \ Current organization context.\n    _current_user: Authenticated user.\n\n\
        Returns:\n    List of data sources with metadata."
      operationId: get_data_sources_api_v1_settings_data_sources_get
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourcesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/repos:
    get:
      tags:
      - Repositories
      summary: List Repos
      description: "List all monitored repositories for the current organization.\n\
        \nArgs:\n    db: Database session.\n    page: Page number (1-indexed).\n \
        \   page_size: Number of items per page.\n    is_active: Filter by active\
        \ status.\n\nReturns:\n    Paginated list of repositories."
      operationId: list_repos_api_v1_repos_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 20
          title: Page Size
        description: Items per page
      - name: is_active
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by active status
          title: Is Active
        description: Filter by active status
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Repositories
      summary: Create Repo
      description: "Add a new repository to monitor.\n\nArgs:\n    db: Database session.\n\
        \    repo: Repository creation data.\n    org_id: Current organization context.\n\
        \nReturns:\n    Created repository."
      operationId: create_repo_api_v1_repos_post
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/repos/{repo_id}:
    get:
      tags:
      - Repositories
      summary: Get Repo
      description: "Get a specific repository by ID.\n\nArgs:\n    db: Database session.\n\
        \    repo_id: Repository ID.\n    org_id: Current organization context.\n\n\
        Returns:\n    Repository details."
      operationId: get_repo_api_v1_repos__repo_id__get
      parameters:
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          title: Repo Id
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Repositories
      summary: Update Repo
      description: "Update a repository.\n\nArgs:\n    db: Database session.\n   \
        \ repo_id: Repository ID.\n    repo_in: Update data.\n    org_id: Current\
        \ organization context.\n\nReturns:\n    Updated repository."
      operationId: update_repo_api_v1_repos__repo_id__patch
      parameters:
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          title: Repo Id
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Repositories
      summary: Delete Repo
      description: "Remove a repository from monitoring.\n\nArgs:\n    db: Database\
        \ session.\n    repo_id: Repository ID.\n    org_id: Current organization\
        \ context."
      operationId: delete_repo_api_v1_repos__repo_id__delete
      parameters:
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          title: Repo Id
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/activities:
    get:
      tags:
      - Activities
      summary: List Activities
      description: "List all activities with optional filtering.\n\nArgs:\n    db:\
        \ Database session.\n    org_id: Current organization ID (from session).\n\
        \    repository_id: Filter by repository ID.\n    team_id: Filter by team\
        \ ID.\n    page: Page number (1-indexed).\n    page_size: Number of items\
        \ per page.\n\nReturns:\n    Paginated list of activities."
      operationId: list_activities_api_v1_activities_get
      parameters:
      - name: repository_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by repository
          title: Repository Id
        description: Filter by repository
      - name: team_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by team
          title: Team Id
        description: Filter by team
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 20
          title: Page Size
        description: Items per page
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/activities/{activity_id}:
    get:
      tags:
      - Activities
      summary: Get Activity
      description: "Get a specific activity by ID.\n\nArgs:\n    db: Database session.\n\
        \    activity_id: Activity ID.\n\nReturns:\n    Activity with business update\
        \ if available."
      operationId: get_activity_api_v1_activities__activity_id__get
      parameters:
      - name: activity_id
        in: path
        required: true
        schema:
          type: string
          title: Activity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityWithUpdate'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/activities/{activity_id}/generate-update:
    post:
      tags:
      - Activities
      summary: Regenerate Business Update
      description: "Regenerate (or generate for the first time) the business update\
        \ for an activity.\n\nUseful for:\n- Reprocessing activities that failed initial\
        \ generation\n- Regenerating updates with improved AI models\n- Processing\
        \ old activities that were synced before this feature\n\nArgs:\n    db: Database\
        \ session.\n    activity_id: Activity ID.\n\nReturns:\n    Activity with newly\
        \ generated business update."
      operationId: regenerate_business_update_api_v1_activities__activity_id__generate_update_post
      parameters:
      - name: activity_id
        in: path
        required: true
        schema:
          type: string
          title: Activity Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityWithUpdate'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/activities/batch-generate-updates:
    post:
      tags:
      - Activities
      summary: Batch Regenerate Business Updates
      description: "Batch regenerate business updates for all activities without one.\n\
        \nUse this to backfill existing activities that were synced before\nthe automatic\
        \ business update generation was implemented.\n\nReturns:\n    Count of processed\
        \ and failed activities."
      operationId: batch_regenerate_business_updates_api_v1_activities_batch_generate_updates_post
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Batch Regenerate Business Updates Api V1 Activities
                  Batch Generate Updates Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/chat:
    post:
      tags:
      - Chat
      summary: Chat
      description: "Send a message and get an AI-generated response about activities.\n\
        \nThe AI will analyze recent development activities and answer\nquestions\
        \ about what the team has been working on.\n\nThe response is adapted based\
        \ on the persona:\n- **executive**: Focus on business outcomes, ROI, strategic\
        \ impact\n- **technical**: Technical details, architecture, code quality\n\
        - **product**: Features delivered, roadmap progress, blockers\n\nExample questions:\n\
        - \"O que o time fez essa semana?\"\n- \"Quais PRs foram abertos?\"\n- \"\
        O que o Pedro commitou?\"\n\nArgs:\n    db: Database session.\n    request:\
        \ Chat request with message, optional filters, and persona.\n    _current_user:\
        \ Authenticated user (required).\n    org_id: Current organization context.\n\
        \nReturns:\n    AI-generated response with activity context and metadata."
      operationId: chat_api_v1_chat_post
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/chat/stream:
    post:
      tags:
      - Chat
      summary: Chat Stream
      description: "Send a message and get a streaming AI-generated response.\n\n\
        Uses Server-Sent Events (SSE) to stream the response in real-time.\nCreates\
        \ or updates conversations and persists messages.\n\nArgs:\n    db: Database\
        \ session.\n    request: Chat request with message, optional filters, and\
        \ persona.\n    _current_user: Authenticated user (required).\n    org_id:\
        \ Current organization context.\n\nReturns:\n    Streaming response with AI-generated\
        \ text chunks and metadata."
      operationId: chat_stream_api_v1_chat_stream_post
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/chat/health:
    get:
      tags:
      - Chat
      summary: Chat Health
      description: "Check chat service health.\n\nReturns:\n    Health status."
      operationId: chat_health_api_v1_chat_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Chat Health Api V1 Chat Health Get
  /api/v1/conversations:
    post:
      tags:
      - Conversations
      summary: Create Conversation
      description: Create a new conversation.
      operationId: create_conversation_api_v1_conversations_post
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Conversations
      summary: List Conversations
      description: List conversations.
      operationId: list_conversations_api_v1_conversations_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/conversations/{conversation_id}:
    get:
      tags:
      - Conversations
      summary: Get Conversation
