[project]
name = "devbridge-backend"
version = "0.1.0"
description = "DevBridge Backend API - Making Technical Work Visible to Non-Technical Stakeholders"
authors = [{ name = "DevBridge Team" }]
requires-python = ">=3.11,<4"
readme = "README.md"
dependencies = [
    "fastapi[all]>=0.115.0,<0.116",
    "uvicorn[standard]>=0.34.0,<0.35",
    "sqlalchemy[asyncio]>=2.0.0,<3",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.14.0,<2",
    "celery[redis]>=5.4.0,<6",
    "redis>=5.2.0,<6",
    "anthropic>=0.42.0,<0.43",
    "langchain>=0.3.0,<0.4",
    "langgraph>=0.2.0,<0.3",
    "instructor>=1.7.0,<2",
    "qdrant-client>=1.12.0,<2",
    "presidio-analyzer>=2.2.0,<3",
    "presidio-anonymizer>=2.2.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "python-multipart>=0.0.18,<0.0.19",
    "httpx>=0.28.0,<0.29",
    "tenacity>=9.0.0,<10",
    "psycopg2-binary>=2.9.11,<3",
    "openai>=2.14.0,<3",
    "resend>=2.19.0,<3",
    "python-jose[cryptography]>=3.5.0,<4",
    "mcp>=1.25.0,<2",
    "playwright>=1.57.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-cov>=6.0.0,<7",
    "pytest-xdist>=3.5.0,<4",
    "httpx>=0.28.0,<0.29",
    "ruff>=0.8.0,<0.9",
    "mypy>=1.14.0,<2",
    "types-redis>=4.6.0,<5",
    "types-requests>=2.32.0,<3",
    "types-PyYAML>=6.0.12.20241230,<7",
    "pyyaml>=6.0.2,<7",
    "pre-commit>=4.0.0,<5",
    "opentelemetry-api>=1.39.1,<2",
    "opentelemetry-sdk>=1.39.1,<2",
    "opentelemetry-instrumentation-fastapi>=0.60b1,<0.61",
    "opentelemetry-instrumentation-httpx>=0.60b1,<0.61",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b1,<0.61",
    "opentelemetry-exporter-otlp>=1.39.1,<2",
    "prometheus-client>=0.23.1,<0.24",
    "structlog>=25.5.0,<26",
    "bandit>=1.9.2,<2",
    "radon>=6.0.1,<7",
    "interrogate>=1.7.0,<2",
]

[tool.hatch.build.targets.sdist]
include = ["app"]

[tool.hatch.build.targets.wheel]
include = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poetry]
package-mode = false

# ============================================================
# Ruff Configuration
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ============================================================
# MyPy Configuration
# ============================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
files = [
    "app/core/rate_limit.py",
    "app/core/middleware.py",
    "app/api/v1/webhooks.py",
    "app/services/ai/base.py",
    "app/services/ai/conversation.py",
    "app/services/privacy_service.py",
    "app/services/embedding_service.py",
    "app/worker.py",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "langchain.*",
    "langgraph.*",
    "instructor.*",
    "qdrant_client.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
]
ignore_missing_imports = true

# ============================================================
# Pytest Configuration
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# ============================================================
# Interrogate Configuration (Documentation)
# ============================================================
[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore-private = true
fail-under = 80
exclude = ["setup.py", "docs", "build"]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 0
quiet = false
whitelist-regex = []
color = true
