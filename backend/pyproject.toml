[tool.poetry]
name = "devbridge-backend"
version = "0.1.0"
description = "DevBridge Backend API - Making Technical Work Visible to Non-Technical Stakeholders"
authors = ["DevBridge Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
# Web Framework
fastapi = {extras = ["all"], version = "^0.115.0"}
uvicorn = {extras = ["standard"], version = "^0.34.0"}
# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.30.0"
alembic = "^1.14.0"
# Task Queue
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.2.0"
# AI / LLM
anthropic = "^0.42.0"
langchain = "^0.3.0"
langgraph = "^0.2.0"
instructor = "^1.7.0"
# Vector Database
qdrant-client = "^1.12.0"
# Privacy
presidio-analyzer = "^2.2.0"
presidio-anonymizer = "^2.2.0"
# Utilities
pydantic-settings = "^2.6.0"
python-multipart = "^0.0.18"
httpx = "^0.28.0"
tenacity = "^9.0.0"
psycopg2-binary = "^2.9.11"
openai = "^2.14.0"
resend = "^2.19.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
mcp = "^1.25.0"
playwright = "^1.57.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
# Linting & Formatting
ruff = "^0.8.0"
mypy = "^1.14.0"
# Type stubs
types-redis = "^4.6.0"
types-requests = "^2.32.0"
# Pre-commit
pre-commit = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ============================================================
# Ruff Configuration
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ============================================================
# MyPy Configuration
# ============================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "langchain.*",
    "langgraph.*",
    "instructor.*",
    "qdrant_client.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
]
ignore_missing_imports = true

# ============================================================
# Pytest Configuration
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
