# MCP Toolbox - Secure Configuration
# ====================================
# This configuration follows security best practices:
#
# 🔒 SECURITY PRINCIPLES:
# 1. Read-Only Access - No INSERT, UPDATE, DELETE operations
# 2. Dedicated User - Uses mcp_readonly with minimal privileges
# 3. Predefined Queries - No dynamic SQL injection possible
# 4. Limited Scope - Only approved operations exposed
# 5. No Sensitive Data Exposure - Queries filter system tables
#
# ⚠️  NEVER expose this server to the internet without authentication!

sources:
  # Read-only PostgreSQL connection
  # Uses dedicated user with SELECT-only permissions
  postgres-readonly:
    kind: postgres
    host: "127.0.0.1"
    port: 5432
    database: "devbridge"
    user: "mcp_readonly"
    password: "mcp_readonly_secure"

tools:
  # ============================================
  # DATABASE EXPLORATION (Read-Only)
  # ============================================

  # List all user databases (excludes system databases)
  list-databases:
    kind: postgres-sql
    source: postgres-readonly
    description: |
      List all user databases in the PostgreSQL instance.
      Returns database name, size, and encoding.
      System databases are excluded.
    statement: |
      SELECT
        datname AS database_name,
        pg_size_pretty(pg_database_size(datname)) AS size,
        pg_encoding_to_char(encoding) AS encoding
      FROM pg_database
      WHERE datistemplate = false
        AND datname NOT IN ('template0', 'template1')
      ORDER BY datname;

  # List all user tables (excludes system schemas)
  list-tables:
    kind: postgres-sql
    source: postgres-readonly
    description: |
      List all user tables in the current database.
      Excludes system schemas (pg_catalog, information_schema).
      Shows schema, table name, and approximate size.
    statement: |
      SELECT
        schemaname AS schema,
        tablename AS table_name,
        pg_size_pretty(pg_total_relation_size(schemaname||'.'||tablename)) AS total_size
      FROM pg_tables
      WHERE schemaname NOT IN ('pg_catalog', 'information_schema', 'pg_toast')
      ORDER BY schemaname, tablename;

  # ============================================
  # SCHEMA INSPECTION (Read-Only)
  # ============================================

  # Describe table columns
  describe-table:
    kind: postgres-sql
    source: postgres-readonly
    description: |
      Get detailed column information for a specific table.
      Shows column names, types, nullability, and defaults.
      Safe: Only reads metadata, no data access.
    parameters:
      - name: table_name
        type: string
        description: The exact name of the table to describe
    statement: |
      SELECT
        column_name,
        data_type,
        is_nullable,
        column_default,
        character_maximum_length
      FROM information_schema.columns
      WHERE table_schema NOT IN ('pg_catalog', 'information_schema')
        AND table_name = $1
      ORDER BY ordinal_position;

  # List table indexes
  list-indexes:
    kind: postgres-sql
    source: postgres-readonly
    description: |
      List all indexes for a specific table.
      Shows index name, type, and columns.
    parameters:
      - name: table_name
        type: string
        description: The table name to list indexes for
    statement: |
      SELECT
        indexname AS index_name,
        indexdef AS definition
      FROM pg_indexes
      WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
        AND tablename = $1
      ORDER BY indexname;

  # List foreign keys
  list-foreign-keys:
    kind: postgres-sql
    source: postgres-readonly
    description: |
      List all foreign key constraints for a table.
      Shows constraint name, columns, and referenced table.
    parameters:
      - name: table_name
        type: string
        description: The table name to list foreign keys for
    statement: |
      SELECT
        tc.constraint_name,
        kcu.column_name,
        ccu.table_name AS foreign_table,
        ccu.column_name AS foreign_column
      FROM information_schema.table_constraints tc
      JOIN information_schema.key_column_usage kcu
        ON tc.constraint_name = kcu.constraint_name
      JOIN information_schema.constraint_column_usage ccu
        ON ccu.constraint_name = tc.constraint_name
      WHERE tc.constraint_type = 'FOREIGN KEY'
        AND tc.table_name = $1;

  # ============================================
  # DATA ANALYSIS (Read-Only, Limited)
  # ============================================

  # Count rows in a table (safe, no data exposure)
  count-rows:
    kind: postgres-sql
    source: postgres-readonly
    description: |
      Get the approximate row count for a table.
      Uses pg_stat for efficiency on large tables.
      Safe: Only returns count, no actual data.
    parameters:
      - name: table_name
        type: string
        description: The table name to count rows for
    statement: |
      SELECT
        relname AS table_name,
        n_live_tup AS approximate_row_count
      FROM pg_stat_user_tables
      WHERE relname = $1;

  # Get table statistics
  table-stats:
    kind: postgres-sql
    source: postgres-readonly
    description: |
      Get performance statistics for a table.
      Shows disk usage, index usage, and sequential scans.
      Useful for optimization analysis.
    parameters:
      - name: table_name
        type: string
        description: The table name to analyze
    statement: |
      SELECT
        relname AS table_name,
        pg_size_pretty(pg_total_relation_size(relid)) AS total_size,
        pg_size_pretty(pg_table_size(relid)) AS table_size,
        pg_size_pretty(pg_indexes_size(relid)) AS indexes_size,
        n_live_tup AS live_rows,
        n_dead_tup AS dead_rows,
        seq_scan AS sequential_scans,
        idx_scan AS index_scans,
        last_vacuum,
        last_autovacuum
      FROM pg_stat_user_tables
      WHERE relname = $1;

  # ============================================
  # SYSTEM HEALTH (Read-Only)
  # ============================================

  # Check database health
  database-health:
    kind: postgres-sql
    source: postgres-readonly
    description: |
      Get basic health metrics for the database.
      Shows connection count, cache hit ratio, and size.
      Safe: No sensitive data exposed.
    statement: |
      SELECT
        (SELECT count(*) FROM pg_stat_activity) AS active_connections,
        (SELECT setting FROM pg_settings WHERE name = 'max_connections') AS max_connections,
        pg_size_pretty(pg_database_size(current_database())) AS database_size,
        current_database() AS database_name,
        version() AS postgres_version;

  # List active connections (sanitized)
  list-connections:
    kind: postgres-sql
    source: postgres-readonly
    description: |
      List active database connections.
      Sensitive data (queries, users) are not exposed.
      Only shows state and wait events.
    statement: |
      SELECT
        pid,
        state,
        wait_event_type,
        wait_event,
        backend_start::date AS connected_since,
        datname AS database
      FROM pg_stat_activity
      WHERE datname = current_database()
        AND pid != pg_backend_pid()
      ORDER BY backend_start;

# ============================================
# TOOLSETS - Organized by Use Case
# ============================================
toolsets:
  # Safe exploration tools
  explore:
    - list-databases
    - list-tables
    - describe-table

  # Schema analysis tools
  schema:
    - describe-table
    - list-indexes
    - list-foreign-keys

  # Performance analysis tools
  performance:
    - count-rows
    - table-stats
    - database-health
    - list-connections

  # All safe tools
  all:
    - list-databases
    - list-tables
    - describe-table
    - list-indexes
    - list-foreign-keys
    - count-rows
    - table-stats
    - database-health
    - list-connections
